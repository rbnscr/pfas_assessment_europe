[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pfas_assessment_europe"
description = " "
version = "0.0.1"

dependencies = [
    "adjustText",
    "factor_analyzer == 0.5.1",
    "geopandas == 1.1.4",
    "pandas == 3.0.5",
    "pyarrow",
    "matplotlib == 3.10.8",
    "cartopy == 0.25.0",
    "seaborn == 0.13.2",
    "openpyxl",
    "numpy == 2.5.3",
    "scipy == 1.18.1",
    "scikit-learn == 1.9.0"
]

requires-python = ">= 3.13"

authors = [
  {name = "Robin Schröder", email = "robin.schroeder94@googlemail.com"}
]

maintainers = [
  {name = "Robin Schröder", email = "robin.schroeder94@googlemail.com"}
]

readme = "README.md"

license = { file = "LICENSE" }

keywords = ["hydrology", "water quality", "europe"]

classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License"
]

[project.optional-dependencies]

dev = [

    "black",
    "isort",
    "flake8",
    "Flake8-pyproject"
]

[project.scripts] 
run-pfas-analysis = "pfas_assessment_europe.run_analysis:main" 

[tool.setuptools.packages.find] 
where = ["src"]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = true
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 88
max-complexity = 18
extend-ignore = ["E203", "E266", "E501", "W503", "F601"]
exclude = [".venv"]
